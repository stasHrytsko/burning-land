<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Сгенерировано tools/build.sh из src/game.html — правьте исходник. -->
</head>
<body>
<title>Poise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@500;700;800&display=swap">
<style>
[hidden]{display:none!important}
:root{
  color-scheme: light;
  --paper:#F3EFE7; --paper-2:#E9E3D8; --card:#FBF9F4; --line:#D8D0C2; --muted:#9A9384;
  --ink:#1E2A44; --ink-2:#56607A;
  --acc:#E4613F; --acc-deep:#B8462A; --acc-soft:#F8DDD3;
  --table:#1F2B46;
  --font-d:"Playfair Display",Georgia,"Times New Roman",serif;
  --font-b:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .15 0 0 0 0 .15 0 0 0 0 .2 0 0 0 .06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
html,body{height:100%}
body{margin:0;background:var(--paper) var(--noise);color:var(--ink);font-family:var(--font-b);font-size:14px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.gl{fill:currentColor;display:block}
.app{max-width:460px;margin:0 auto;display:flex;flex-direction:column;min-height:100%}

/* шапка */
.top{position:relative;display:flex;justify-content:center;padding:14px 16px 8px}
.logo{display:flex;flex-direction:column;align-items:center;font-family:var(--font-d);font-weight:600;font-size:30px;letter-spacing:.34em;padding-left:.34em;line-height:1;color:var(--ink)}
.logo i{width:9px;height:9px;background:var(--acc);transform:rotate(45deg);margin-top:9px;margin-left:-.34em}
.gear{position:absolute;right:12px;top:12px;width:40px;height:40px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;border-radius:50%}
.gear:hover{background:var(--paper-2)}
.gear .gl{width:26px;height:26px}

/* ходы */
.log{padding:4px 16px 12px}
.log-head{display:flex;align-items:center;gap:10px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
.log-head .rule{flex:1;height:1px;background:var(--line)}
.log-head small{font-size:11.5px;letter-spacing:0;text-transform:none}
.hist{display:flex;gap:4px}
.hlab{display:flex;flex-direction:column;gap:5px;width:36px;flex:none}
.hlab span{flex:1;display:flex;align-items:center;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.hlab span:first-child{flex:0 0 16px}
.hcol{flex:1 1 0;min-width:0;max-width:44px;display:flex;flex-direction:column;gap:5px}
.hcol .hn{flex:0 0 16px;text-align:center;font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hcol.now .hn{color:var(--acc);font-weight:800}
.cell{aspect-ratio:1;min-height:0;overflow:hidden;position:relative;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);box-shadow:0 1px 1px rgba(30,42,68,.05)}
.cell>.gl{position:absolute;left:23%;top:23%;width:54%;height:54%}
.cell.empty{background:transparent;border-style:dashed;box-shadow:none}
.hcol.now .cell.empty{border-color:var(--acc)}
.cell.lost{opacity:.5}
.cell.won::after{content:"";position:absolute;left:22%;right:22%;bottom:3px;height:2px;border-radius:2px;background:var(--acc)}
.cell.won.foe::after{background:var(--ink)}
.cell .was{position:absolute;top:2px;left:2px;width:36%;height:36%;color:var(--acc)}
.cell .was .gl{width:100%;height:100%}
.cell .was::after{content:"";position:absolute;left:-12%;right:-12%;top:46%;height:1.6px;background:var(--acc);transform:rotate(-40deg)}

/* соперник */
.foe-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px 16px;border-top:1px solid var(--line);margin-inline:0}
.ava{width:66px;height:66px;border-radius:50%;border:2.5px solid var(--acc);background:var(--card);display:grid;place-items:center;padding:0;box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 5.5px color-mix(in srgb,var(--acc) 45%,transparent);flex:none}
.ava svg{width:40px;height:40px}
button.ava:hover{box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 5.5px var(--acc)}
.who{position:relative;min-width:0;display:flex;flex-direction:column;gap:2px}
.who .nm{font-weight:800;font-size:14px;letter-spacing:.07em;text-transform:uppercase}
.who .hp{font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.who .hp b{font-size:27px;font-weight:800;color:var(--ink);line-height:1.05}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;max-width:190px;margin-top:3px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .5s}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.rnd{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-variant-numeric:tabular-nums}
.rnd b{color:var(--ink)}
.fch{display:flex;gap:6px}
.fc{width:40px;border:1px solid var(--line);border-radius:8px;background:var(--card);display:flex;flex-direction:column;align-items:center;padding:6px 0 3px;box-shadow:0 1px 2px rgba(30,42,68,.06)}
.fc .gl{width:20px;height:20px}
.fc b{font-weight:800;font-size:17px;line-height:1.3}
.fc.declared{border-color:var(--acc);box-shadow:0 0 0 1.5px var(--acc)}
.fc.declared .gl{color:var(--acc)}

/* стол */
.table{position:relative;background:var(--table) var(--noise);color:var(--paper);padding:16px 16px 16px;box-shadow:inset 0 5px 0 var(--table),inset 0 6px 0 rgba(243,239,231,.35),inset 0 -5px 0 var(--table),inset 0 -6px 0 rgba(243,239,231,.35);user-select:none;-webkit-user-select:none}
.trow{display:flex;justify-content:center;gap:30px}
.slot{display:flex;flex-direction:column;align-items:center;gap:7px}
.lab{font-size:12.5px;color:rgba(243,239,231,.82)}
.tcard{position:relative;width:78px;height:106px;perspective:700px;transform:rotate(var(--tilt,0deg))}
.tcard::before{content:"";position:absolute;inset:0;border:1.5px dashed rgba(243,239,231,.22);border-radius:9px}
.cin{position:absolute;inset:0;transition:transform .5s cubic-bezier(.3,.7,.2,1),opacity .25s;transform-style:preserve-3d}
.tcard.down .cin{transform:rotateY(180deg)}
.tcard.empty .cin{opacity:0}
.f{position:absolute;inset:0;border-radius:9px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.f.front{background:var(--card);color:var(--ink);display:grid;place-items:center;box-shadow:0 10px 22px rgba(0,0,0,.35)}
.f.front .gl{width:44px;height:44px}
.f.front .num{position:absolute;top:5px;left:9px;font-weight:800;font-size:19px;color:var(--acc)}
.mine .f.front .gl{color:var(--acc)}
.f.back{transform:rotateY(180deg);border:3px solid var(--card);box-shadow:0 10px 22px rgba(0,0,0,.35);
  background:
    radial-gradient(circle at 50% 50%,var(--acc) 0 12px,transparent 12.5px),
    repeating-linear-gradient(45deg,rgba(251,249,244,.22) 0 1px,transparent 1px 7px),
    repeating-linear-gradient(-45deg,rgba(251,249,244,.22) 0 1px,transparent 1px 7px),
    var(--acc)}
.f.back::before{content:"";position:absolute;inset:5px;border:1px solid rgba(251,249,244,.55);border-radius:5px}
.f.back::after{content:"P";position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:1.5px solid var(--card);display:grid;place-items:center;font-family:var(--font-d);font-weight:700;font-size:15px;color:var(--card)}
.tcard.deal .cin{animation:deal .35s cubic-bezier(.3,.7,.2,1)}
@keyframes deal{0%{transform:translateY(-14px) scale(.9);opacity:0}}
.tcard.bluffed .f.front::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:3px;border-radius:2px;background:var(--acc);transform:rotate(-38deg)}
.tcard.bluffed{animation:crack .45s}
@keyframes crack{20%{transform:rotate(calc(var(--tilt,0deg) - 5deg)) translateX(-3px)}45%{transform:rotate(calc(var(--tilt,0deg) + 4deg)) translateX(3px)}70%{transform:rotate(var(--tilt,0deg)) translateX(-2px)}}
.tcard.hit-up{animation:hitUp .5s cubic-bezier(.3,.7,.2,1)}
.tcard.hit-down{animation:hitDown .5s cubic-bezier(.3,.7,.2,1)}
@keyframes hitUp{35%{transform:rotate(var(--tilt,0deg)) translateY(-34px) scale(1.06)}}
@keyframes hitDown{35%{transform:rotate(var(--tilt,0deg)) translateY(34px) scale(1.06)}}
.tcard.shake{animation:shake .45s .12s}
@keyframes shake{20%{transform:rotate(calc(var(--tilt,0deg) - 7deg)) translateX(-5px)}45%{transform:rotate(calc(var(--tilt,0deg) + 5deg)) translateX(4px)}70%{transform:rotate(var(--tilt,0deg)) translateX(-2px)}}
.tcard.bump-up{animation:bumpUp .42s ease-out}
.tcard.bump-down{animation:bumpDown .42s ease-out}
@keyframes bumpUp{40%{transform:rotate(var(--tilt,0deg)) translateY(-14px)}}
@keyframes bumpDown{40%{transform:rotate(var(--tilt,0deg)) translateY(14px)}}
.tcard.sweep .cin{transition:transform .3s,opacity .3s;opacity:0;transform:translateX(40px) rotate(8deg)}
.divider{display:flex;align-items:center;gap:12px;margin:14px 0 12px;min-height:34px}
.divider i{flex:1;height:1px;background:rgba(243,239,231,.28);transition:background .3s}
.divider span{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(243,239,231,.78);text-align:center;max-width:70%}
.divider.bluff i{background:var(--acc)}
.divider.bluff span{white-space:nowrap;max-width:none;font-family:var(--font-d);font-size:clamp(19px,6vw,25px);letter-spacing:.14em;color:var(--acc);animation:stamp .4s cubic-bezier(.3,.7,.2,1)}
.divider.res span{color:var(--paper)}
@keyframes stamp{0%{transform:scale(1.6);opacity:0}}
.you-row{display:flex;align-items:center;gap:12px;margin-top:16px}
.you-row .who{flex:1}
.table .ava{background:var(--card)}
.table .who .nm{color:var(--paper)}
.table .who .hp{color:rgba(243,239,231,.7)}
.table .who .hp b{color:var(--paper)}
.table .bar{background:rgba(243,239,231,.2)}
.pop{position:absolute;right:0;top:-4px;font-weight:800;font-size:26px;color:var(--acc);animation:popup 1.4s forwards;pointer-events:none;white-space:nowrap}
.pop.note{font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--acc);color:#fff;padding:2px 7px;border-radius:4px;top:-18px}
@keyframes popup{0%{opacity:0;transform:translateY(8px)}14%{opacity:1;transform:translateY(0)}78%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}

/* рука */
.hand-wrap{position:relative;padding:12px 16px 18px;flex:1}
.hand-top{display:flex;justify-content:flex-end;height:44px;margin-bottom:-8px}
.legend-btn{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--ink);background:var(--card);padding:0;display:grid;place-items:center;position:relative;z-index:6;margin-top:-6px;box-shadow:0 2px 6px rgba(30,42,68,.1)}
.legend-btn svg{width:42px;height:42px}
.legend-pop{position:absolute;right:16px;top:58px;z-index:8;background:var(--ink);color:var(--paper);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px;box-shadow:0 10px 26px rgba(30,42,68,.3)}
.legend-pop div{display:flex;align-items:center;gap:6px}
.legend-pop b{display:inline-flex;align-items:center;gap:4px}
.legend-pop .gl{width:16px;height:16px;color:var(--acc)}
.hand{display:flex;justify-content:center;align-items:flex-end;padding-top:4px}
.hc{position:relative;width:32%;max-width:136px;aspect-ratio:3/4.25;margin:0 -5px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);box-shadow:0 12px 22px rgba(30,42,68,.13);display:flex;flex-direction:column;align-items:center;padding:12px 6px 10px;color:var(--ink);transform:rotate(var(--r)) translateY(var(--y));transition:transform .25s cubic-bezier(.3,.7,.2,1),box-shadow .25s,opacity .3s,border-color .2s;touch-action:manipulation;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.hc:nth-child(1){--r:-7deg;--y:10px;z-index:1}
.hc:nth-child(2){--r:0deg;--y:0px;z-index:2}
.hc:nth-child(3){--r:7deg;--y:10px;z-index:3}
.hc:not(:disabled):hover{--y:-4px}
.hc:disabled{cursor:default}
.hc .mn{font-weight:800;font-size:clamp(10px,2.9vw,13px);letter-spacing:.03em;text-transform:uppercase;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.hc .pw{font-weight:800;font-size:clamp(28px,9vw,38px);line-height:1;display:flex;align-items:flex-start;gap:2px;margin-top:2px;font-variant-numeric:tabular-nums}
.hc .pw em{font-style:normal;font-size:11px;background:var(--acc);color:#fff;border-radius:4px;padding:1px 4px;margin-top:4px}
.hc .pl{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hc .big-g{width:calc(34% + var(--ch) * 3.5%);height:auto;aspect-ratio:1;margin:auto 0 4px;transition:width .4s}
.pips{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.pips i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--acc)}
.hc.declared{--y:-12px;border-color:var(--acc);box-shadow:0 0 0 2px var(--acc),0 16px 28px rgba(228,97,63,.25)}
.hc.declared:nth-child(1),.hc.declared:nth-child(3){--y:-4px}
.hc.declared .big-g{color:var(--acc)}
.hc.dim{opacity:.4}
.hc.full::before{content:"";position:absolute;inset:-5px;border-radius:16px;border:2px solid var(--acc);opacity:0;animation:ring 1.8s ease-out infinite;pointer-events:none}
@keyframes ring{0%{opacity:.8;transform:scale(.97)}100%{opacity:0;transform:scale(1.04)}}
.hc.inhale .big-g{animation:inhale .8s ease-out}
.hc.exhale .big-g{animation:exhale .8s ease-out}
@keyframes inhale{40%{transform:scale(1.2)}}
@keyframes exhale{40%{transform:scale(.8);opacity:.5}}
.hint{margin:16px 0 0;text-align:center;font-size:14.5px;color:var(--ink-2);min-height:42px;text-wrap:balance}
.hint b{color:var(--ink)}
.hint small{display:block;color:var(--muted);font-size:11.5px;margin-top:3px}
.hint.tap{cursor:pointer}
.fly{position:fixed;z-index:30;border-radius:10px;background:var(--card);display:grid;place-items:center;box-shadow:0 14px 28px rgba(0,0,0,.3);pointer-events:none;color:var(--ink)}
.fly .gl{width:48%;height:auto;aspect-ratio:1}

/* предпросмотр */
.pv{position:absolute;left:16px;right:16px;z-index:9;background:var(--ink);color:var(--paper);border-radius:8px;padding:10px 12px 9px;box-shadow:0 12px 28px rgba(30,42,68,.35);pointer-events:none;max-width:280px;margin-inline:auto}
.pv h4{margin:0 0 6px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.pr{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;padding:3px 0;border-top:1px solid rgba(243,239,231,.12)}
.pr .gl{width:16px;height:16px}
.pr em{font-style:normal;font-size:10px;background:var(--acc);color:#fff;border-radius:3px;padding:0 4px;margin-left:4px}
.pr b{font-weight:800;white-space:nowrap}
.pr.w b{color:var(--acc)}
.pr.l b{color:#C9CCD6}
.pr.d b{color:#8E94A6;font-weight:500}
.pr small{grid-column:2/-1;color:#C9CCD6;font-size:10.5px;margin-top:-2px}
.pvn{font-size:10.5px;color:#8E94A6;margin-top:4px}

/* окна */
.ov{position:fixed;inset:0;z-index:20;background:rgba(30,42,68,.5);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-top:calc(16px + env(safe-area-inset-top,0px))}
.panel{background:var(--paper) var(--noise);width:100%;max-width:440px;max-height:100%;overflow:auto;border-radius:12px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(30,42,68,.35);color:var(--ink)}
.panel h2{font-family:var(--font-d);font-weight:700;font-size:23px;margin:0;text-wrap:balance}
.panel h3{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:4px 0 0}
.panel p{margin:0}
.ph-row{display:flex;align-items:center;gap:10px}
.x{margin-left:auto;border:0;background:transparent;font-size:26px;line-height:1;padding:2px 6px;color:var(--ink-2)}
.rules-mini{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}
.tri{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;color:var(--ink)}
.tri .t{display:inline-flex;align-items:center;gap:4px;font-weight:800}
.tri .t .gl{width:16px;height:16px}
.foes{display:flex;flex-direction:column;gap:8px}
.foe-card{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px}
.foe-card:hover{border-color:var(--ink-2)}
.foe-card.cur{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.foe-card .mini{width:42px;height:42px;border-radius:50%;border:2px solid var(--acc);display:grid;place-items:center;grid-row:span 2}
.foe-card .mini svg{width:26px;height:26px}
.foe-card b{font-weight:800;font-size:15px}
.foe-card .rec{font-size:12px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.foe-card .h{grid-column:2/-1;font-size:12.5px;color:var(--ink-2)}
.foe-card .hk{color:var(--ink);font-weight:700}
.foe-card .a{grid-column:1/-1;font-size:12px;color:var(--ink);border-left:2px solid var(--acc);padding-left:8px;margin-top:4px}
.foe-info{display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.foe-info .row{display:flex;flex-direction:column;gap:2px;padding-bottom:7px;border-bottom:1px dashed var(--line)}
.foe-info .row span:first-child{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.foe-info .hidden{color:var(--muted)}
.foe-info .on{font-weight:700}
.end-head{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding-top:4px}
.big{font-family:var(--font-d);font-weight:700;font-size:34px;line-height:1.05}
.end-sub{font-size:13px;color:var(--ink-2)}
.score{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.score>div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:5px}
.score .lab2{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--ink-2)}
.score .lab2 b{margin-left:auto;font-weight:800;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.stats{display:flex;flex-direction:column;gap:4px;font-size:13px}
.stats div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:3px}
.stats span:last-child{font-weight:800;font-variant-numeric:tabular-nums}
.log-wrap{overflow-x:auto}
table.jr{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
.jr th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);text-align:left;font-weight:700;padding:4px}
.jr td{padding:5px 4px;border-top:1px solid var(--line);white-space:nowrap}
.pair{display:inline-flex;align-items:center;gap:3px;vertical-align:middle}
.pair .gl{width:15px;height:15px}
.pair.bl{color:var(--acc);text-decoration:line-through}
.pair.ar{color:var(--muted)}
.adapt{border-left:2px solid var(--acc);padding-left:8px;font-size:12.5px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 auto;border:0;background:var(--acc);color:#fff;border-radius:8px;padding:12px 14px;font-weight:800;font-size:14.5px;box-shadow:0 2px 0 var(--acc-deep)}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.st{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.sl{font-size:13px}
.sl small{display:block;font-size:11px;color:var(--muted)}
.ctl{display:flex;align-items:center;gap:4px;flex:none}
.sb{width:32px;height:32px;border-radius:6px;border:1px solid var(--line);background:var(--card);font-size:17px;line-height:1}
.sb:hover{border-color:var(--ink-2)}
.ctl output{min-width:30px;text-align:center;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.ctl output.chg{color:var(--acc)}
.inv{font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.inv b{font-variant-numeric:tabular-nums}
.inv .ok{font-weight:700}
.inv .warn{color:var(--acc);font-weight:700}
.sw{display:flex;align-items:flex-start;gap:10px;font-size:13px;padding:5px 0;cursor:pointer}
.sw input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--acc);flex:none}
.sw small{display:block;font-size:11px;color:var(--muted)}
.note{font-size:12px;color:var(--ink-2)}
.linkish{border:0;background:none;padding:0;text-decoration:underline;font-size:12px;color:var(--ink-2);align-self:flex-start}

@media (max-width:370px){ .tcard{width:68px;height:92px} .trow{gap:22px} .ava{width:58px;height:58px} .who .hp b{font-size:23px} .fc{width:36px} }
@media (prefers-reduced-motion: reduce){
  .hc.full::before{animation:none}
  .cin{transition-duration:.01s}
  .tcard,.tcard .cin,.divider span{animation:none!important}
}

<script>
(() => {
const KEY = 'vyderzhka-proto-v2';
const OLD_KEY = 'vyderzhka-proto-v1';
const MOVES = ['S','P','F'];
const NAME = {S:'Удар', P:'Парирование', F:'Финт'};
const LOW = {S:'удар', P:'парирование', F:'финт'};
const BEATS = {S:'F', P:'S', F:'P'};
const COUNTER = {S:'P', P:'F', F:'S'};
const VERB = {S:'Удар бьёт финт', P:'Парирование ловит удар', F:'Финт обманывает парирование'};
const EMBLEM = {rock:'e-rock', hot:'e-hot', fox:'e-fox'};
const RULES_V1 = {rounds:10, hp:45, start:2, reset:1, growth:1, max:5, bonus:1, parryKeep:2};
const VIEW_V1 = {showDamage:true, fullHistory:true, preview:true};
const RULE_DEFS = [
  {key:'rounds', label:'Раундов в бою', min:3, max:20},
  {key:'hp', label:'Здоровье', min:5, max:99},
  {key:'start', label:'Стартовая сила приёма', min:1, max:12},
  {key:'reset', label:'Сила после использования', min:0, max:12},
  {key:'growth', label:'Рост неиспользованного', note:'за раунд', min:0, max:5},
  {key:'max', label:'Максимум силы', min:1, max:12},
  {key:'bonus', label:'Бонус за сдержанное слово', note:'к урону при победе в обмене', min:0, max:5},
  {key:'parryKeep', label:'Парирование после победы', note:'сила выигравшего парирования после сброса', min:0, max:12},
];
const VIEW_DEFS = [
  {key:'showDamage', label:'Урон при победе на картах', note:'во второй фазе; выкл — только текущая сила'},
  {key:'fullHistory', label:'Все раунды в «Ходах»', note:'выкл — последние 3'},
  {key:'preview', label:'Предпросмотр исходов', note:'зажми карту (или наведи мышью) — три исхода против каждого ответа'},
];

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TS = reduce ? 0.05 : 1;
const sleep = ms => new Promise(r => setTimeout(r, ms * TS));
const $ = id => document.getElementById(id);
const rnd = Math.random;
const pick = a => a[Math.floor(rnd() * a.length)];
const glyph = (m, cls='') => `<svg class="gl ${cls}" aria-hidden="true"><use href="#g-${m}"/></svg>`;
const emblem = id => `<svg aria-hidden="true"><use href="#${EMBLEM[id] || 'e-rock'}"/></svg>`;
const pct = x => Math.round(x * 100) + '%';
const clone = o => JSON.parse(JSON.stringify(o));

function loadSettings(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const o = JSON.parse(raw);
      return {rules:{...RULES_V1, ...o.rules}, view:{...VIEW_V1, ...o.view}, mem:o.mem || {}, last:o.last || 'rock'};
    }
    const old = localStorage.getItem(OLD_KEY);
    if (old) {
      const o = JSON.parse(old);
      return {rules:{...RULES_V1}, view:{...VIEW_V1}, mem:o.mem || {}, last:o.last || 'rock'};
    }
  } catch(e) {}
  return {rules:{...RULES_V1}, view:{...VIEW_V1}, mem:{}, last:'rock'};
}
function saveSettings(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
const S = loadSettings();

/* ---------- соперники ---------- */
function argmax(ch){ const top = Math.max(...MOVES.map(m => ch[m])); return pick(MOVES.filter(m => ch[m] === top)); }
function weighted(ch){
  const w = MOVES.map(m => ch[m] * ch[m] + .5);
  let t = rnd() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < 3; i++) { t -= w[i]; if (t <= 0) return MOVES[i]; }
  return 'F';
}
const lastBluffed = log => { const l = log[log.length - 1]; return !!l && l.foe.intent !== l.foe.action; };
const ENEMIES = [
  {id:'rock', name:'Скала', level:'учебный',
   tend:'Показывает свой самый заряженный приём.',
   rule:'Всегда делает то, что показал.',
   need:3,
   seen: log => log.filter(l => l.foe.intent === l.foe.action).length,
   declare: me => argmax(me.ch),
   act: c => ({m:c.myIntent, forced:true})},
  {id:'hot', name:'Горячий', level:'средний',
   tend:'Часто отвечает на твоё намерение.',
   rule:'Когда удар заряжен до 4 и выше — всегда показывает удар и бьёт им.',
   need:2,
   seen: log => log.filter(l => l.foe.ch.S >= 4).length,
   declare: me => me.ch.S >= 4 ? 'S' : weighted(me.ch),
   act: c => {
     if (c.me.ch.S >= 4) return {m:'S', forced:true};
     return {m: rnd() < .6 ? COUNTER[c.yourIntent] : c.myIntent, forced:false};
   }},
  {id:'fox', name:'Лис', level:'хитрый',
   tend:'Часто показывает одно, а делает другое.',
   rule:'Никогда не блефует два раунда подряд.',
   need:2,
   seen: log => log.filter((l, i) => i > 0 && log[i - 1].foe.intent !== log[i - 1].foe.action).length,
   declare: me => weighted(me.ch),
   act: c => {
     if (lastBluffed(G.log)) return {m:c.myIntent, forced:true};
     return {m: rnd() < .7 ? COUNTER[COUNTER[c.myIntent]] : c.myIntent, forced:false};
   }},
];
const enemyById = id => ENEMIES.find(e => e.id === id) || ENEMIES[0];
const ruleKnown = id => !!(S.mem[id] && S.mem[id].known);

function computeAdapt(id){
  const m = S.mem[id];
  if (!m || !m.fights) return null;
  const e = enemyById(id);
  if (id === 'rock') return {kind:'favorite', move:m.favorite,
    text:`${e.name} запомнил: в прошлом бою ты чаще всего играл «${LOW[m.favorite]}». Теперь он чаще показывает то, что это бьёт.`};
  if (m.bluffRate >= .4) return {kind:'distrust',
    text:`${e.name} заметил, что ты часто меняешь намерение (${pct(m.bluffRate)} раундов), и перестал ему верить.`};
  if (m.bluffRate <= .2) return {kind:'trust',
    text:`${e.name} заметил, что ты почти всегда держишь слово (блеф в ${pct(m.bluffRate)} раундов), и теперь чаще отвечает на твоё намерение.`};
  return {kind:'none', text:`${e.name} не нашёл в твоей прошлой игре явной привычки.`};
}
function enemyDeclare(){
  const e = enemyById(G.enemyId);
  if (G.adapt && G.adapt.kind === 'favorite' && rnd() < .6) return COUNTER[G.adapt.move];
  return e.declare(G.foe);
}
function enemyAct(){
  const e = enemyById(G.enemyId);
  const c = {me:G.foe, myIntent:G.foe.intent, yourIntent:G.you.intent};
  const r = e.act(c);
  if (r.forced) return r.m;
  if (G.adapt && G.adapt.kind === 'trust' && rnd() < .45) return COUNTER[c.yourIntent];
  if (G.adapt && G.adapt.kind === 'distrust' && rnd() < .45) return c.yourIntent;
  return r.m;
}

function sanitize(r){ const o = {...RULES_V1, ...r}; o.start = Math.min(o.start, o.max); o.reset = Math.min(o.reset, o.max); o.parryKeep = Math.min(o.parryKeep, o.max); return o; }
function maxDamageByRound(r0){
  const r = sanitize(r0);
  const best = [0];
  let cur = new Map([[`${r.start},${r.start},${r.start}`, 0]]);
  for (let k = 1; k <= r.rounds; k++) {
    const nx = new Map();
    for (const [key, v] of cur) {
      const c = key.split(',').map(Number);
      for (let j = 0; j < 3; j++) {
        const g = v + c[j] + r.bonus;
        const nk = c.map((x, t) => t === j ? (MOVES[j] === 'P' ? r.parryKeep : r.reset) : Math.min(r.max, x + r.growth)).join(',');
        if (!(nx.get(nk) >= g)) nx.set(nk, g);
      }
    }
    cur = nx;
    let b = 0; for (const v of cur.values()) b = Math.max(b, v);
    best.push(b);
  }
  return best;
}

/* ---------- состояние боя ---------- */
let G = null, U = null, skipFn = null, busy = false;
const freshU = () => ({revealed:false, breath:{}, outcome:null, played:null});
function side(r){ return {hp:r.hp, ch:{S:r.start, P:r.start, F:r.start}, intent:null, action:null}; }

function newFight(enemyId){
  const r = sanitize(S.rules);
  S.last = enemyId; saveSettings();
  G = {rules:r, enemyId, round:1, phase:'intent', you:side(r), foe:side(r), log:[], adapt:computeAdapt(enemyId)};
  U = freshU(); skipFn = null; busy = false;
  closeAll(); render();
}

function restartAnim(e, cls){ e.classList.remove(cls); void e.getBoundingClientRect(); e.classList.add(cls); }

async function fly(fromEl, toEl, m){
  if (reduce || !fromEl || !toEl) return;
  const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
  const f = document.createElement('div');
  f.className = 'fly';
  f.innerHTML = glyph(m);
  f.style.cssText = `left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px`;
  document.body.appendChild(f);
  try {
    await f.animate([
      {left:a.left + 'px', top:a.top + 'px', width:a.width + 'px', height:a.height + 'px', transform:'rotate(0deg)'},
      {left:b.left + 'px', top:b.top + 'px', width:b.width + 'px', height:b.height + 'px', transform:'rotate(6deg)'}
    ], {duration:380, easing:'cubic-bezier(.3,.7,.2,1)'}).finished;
  } catch(e) {}
  f.remove();
}

async function onMove(m, btn){
  if (!G || busy) return;
  if (G.phase === 'intent') {
    busy = true;
    await fly(btn, $('c-you-i'), m);
    G.you.intent = m; G.foe.intent = enemyDeclare(); G.phase = 'action';
    busy = false;
    render();
  } else if (G.phase === 'action') {
    busy = true;
    await fly(btn, $('c-you-a'), m);
    G.you.action = m; G.foe.action = enemyAct(); G.phase = 'reveal';
    U.played = {you:G.you.ch[m]};
    busy = false;
    runReveal();
  }
}

function grow(s, won){
  const r = G.rules, out = {};
  MOVES.forEach(m => {
    const before = s.ch[m];
    const used = won && m === 'P' ? r.parryKeep : r.reset;
    s.ch[m] = m === s.action ? used : Math.min(r.max, before + r.growth);
    out[m] = s.ch[m] > before ? 'inhale' : (s.ch[m] < before ? 'exhale' : '');
  });
  return out;
}
function waitOrTap(ms){
  return new Promise(res => {
    const t = setTimeout(done, reduce ? 700 : ms);
    function done(){ clearTimeout(t); skipFn = null; res(); }
    skipFn = done;
  });
}
function pop(who, text, cls=''){
  const e = document.createElement('div');
  e.className = 'pop ' + cls;
  e.textContent = text;
  $(who === 'you' ? 'youWho' : 'foeWho').appendChild(e);
  setTimeout(() => e.remove(), 1500);
}

async function runReveal(){
  const g = G, y = G.you, f = G.foe, r = G.rules;
  const rec = {round:G.round, you:{intent:y.intent, action:y.action, ch:{...y.ch}}, foe:{intent:f.intent, action:f.action, ch:{...f.ch}}, winner:null, dmg:0, bonus:false};
  if (y.action !== f.action) {
    const youWin = BEATS[y.action] === f.action;
    rec.winner = youWin ? 'you' : 'foe';
    const w = youWin ? y : f;
    rec.bonus = w.intent === w.action && r.bonus > 0;
    rec.dmg = w.ch[w.action] + (w.intent === w.action ? r.bonus : 0);
  }
  U.revealed = false; U.rec = rec; render();
  await sleep(450); if (G !== g) return;

  U.revealed = true; render();
  await sleep(rec.you.intent !== rec.you.action || rec.foe.intent !== rec.foe.action ? 750 : 450); if (G !== g) return;

  if (rec.winner) {
    const loser = rec.winner === 'you' ? 'foe' : 'you';
    restartAnim($(`c-${rec.winner}-a`), rec.winner === 'you' ? 'hit-up' : 'hit-down');
    restartAnim($(`c-${loser}-a`), 'shake');
    await sleep(180); if (G !== g) return;
    G[loser].hp -= rec.dmg;
    pop(loser, '−' + rec.dmg);
    if (rec.bonus) pop(rec.winner, `+${r.bonus} за слово`, 'note');
  } else {
    restartAnim($('c-you-a'), 'bump-up');
    restartAnim($('c-foe-a'), 'bump-down');
  }
  U.shown = true; renderHUD(); renderTable();
  await sleep(520); if (G !== g) return;

  U.breath = grow(y, rec.winner === 'you'); grow(f, rec.winner === 'foe');
  G.log.push(rec); U.outcome = rec;
  const e = enemyById(G.enemyId);
  if (!ruleKnown(G.enemyId) && e.seen(G.log) >= e.need) {
    S.mem[G.enemyId] = {...(S.mem[G.enemyId] || {fights:0, w:0, l:0, d:0}), known:true};
    saveSettings();
    pop('foe', 'привычка раскрыта', 'note');
  }
  render();

  await waitOrTap(2000); if (G !== g) return;
  const over = G.round >= r.rounds || y.hp <= 0 || f.hp <= 0;
  if (over) { endFight(); return; }
  ['c-foe-i', 'c-foe-a', 'c-you-i', 'c-you-a'].forEach(id => $(id).classList.add('sweep'));
  await sleep(300); if (G !== g) return;
  ['c-foe-i', 'c-foe-a', 'c-you-i', 'c-you-a'].forEach(id => $(id).classList.remove('sweep'));
  G.round++;
  y.intent = y.action = f.intent = f.action = null;
  G.phase = 'intent'; U = freshU(); render();
}

function outcomeText(rec){
  const y = rec.you, f = rec.foe, parts = [];
  if (!rec.winner) parts.push(`Оба сыграли «${LOW[y.action]}» — урона нет.`);
  else {
    const w = rec[rec.winner], base = w.ch[w.action];
    const how = rec.bonus ? ` (${base} + ${G.rules.bonus} за слово)` : '';
    parts.push(`${VERB[w.action]}. ${rec.winner === 'you' ? 'Соперник теряет' : 'Ты теряешь'} <b>${rec.dmg}</b>${how}.`);
    if (w.action === 'P' && G.rules.parryKeep > G.rules.reset) parts.push(`Парирование сохраняет силу ${G.rules.parryKeep}.`);
  }
  if (f.intent !== f.action) parts.push(`Соперник блефовал: показал ${LOW[f.intent]}, сыграл ${LOW[f.action]}.`);
  if (y.intent !== y.action && rec.winner) parts.push(rec.winner === 'you' ? 'Твой блеф сработал.' : 'Твой блеф не сработал.');
  return parts.join(' ');
}

function endFight(){
  G.phase = 'over';
  const y = G.you, f = G.foe, log = G.log, n = log.length;
  const res = y.hp > f.hp ? 'win' : (y.hp < f.hp ? 'lose' : 'draw');
  const myBluffs = log.filter(l => l.you.intent !== l.you.action);
  const foeBluffs = log.filter(l => l.foe.intent !== l.foe.action);
  const cnt = {S:0, P:0, F:0}; log.forEach(l => cnt[l.you.action]++);
  const favorite = argmax(cnt);
  const prev = S.mem[G.enemyId] || {fights:0, w:0, l:0, d:0};
  S.mem[G.enemyId] = {...prev, fights:prev.fights + 1, w:prev.w + (res === 'win'), l:prev.l + (res === 'lose'), d:prev.d + (res === 'draw'), bluffRate: n ? myBluffs.length / n : 0, favorite};
  saveSettings();
  const next = computeAdapt(G.enemyId);
  const e = enemyById(G.enemyId);
  const title = {win:'Победа', lose:'Поражение', draw:'Ничья'}[res];
  const sub = {win:'Ты прочитал соперника лучше.', lose:`${e.name} прочитал тебя лучше.`, draw:'Никто не уступил.'}[res];
  const pair = s => `<span class="pair ${s.intent !== s.action ? 'bl' : ''}">${glyph(s.intent)}</span><span class="pair ar">→</span><span class="pair">${glyph(s.action)}</span>`;
  const rows = log.map(l => `<tr><td>${l.round}</td><td>${pair(l.you)}</td><td>${pair(l.foe)}</td><td>${l.winner ? (l.winner === 'you' ? `−${l.dmg} сопернику` : `−${l.dmg} тебе`) : 'ничья'}${l.bonus ? ' · слово' : ''}</td></tr>`).join('');
  const H = G.rules.hp;
  $('endBody').innerHTML = `
    <div class="end-head"><div class="big" id="endTitle">${title}</div><div class="end-sub">${sub}</div></div>
    <div class="score">
      <div><span class="lab2">Ты<b>${Math.max(0, y.hp)} / ${H}</b></span><div class="bar"><i style="width:${Math.max(0, y.hp) / H * 100}%"></i></div></div>
      <div><span class="lab2">${e.name}<b>${Math.max(0, f.hp)} / ${H}</b></span><div class="bar"><i style="width:${Math.max(0, f.hp) / H * 100}%"></i></div></div>
    </div>
    <div class="stats">
      <div><span>Твоих блефов</span><span>${myBluffs.length} из ${n}, сработали ${myBluffs.filter(l => l.winner === 'you').length}</span></div>
      <div><span>Блефов соперника</span><span>${foeBluffs.length}, ты поймал ${foeBluffs.filter(l => l.winner === 'you').length}</span></div>
      <div><span>Сдержал слово и выиграл обмен</span><span>${log.filter(l => l.winner === 'you' && l.bonus).length}</span></div>
    </div>
    <h3>Журнал · показал → сыграл</h3>
    <div class="log-wrap"><table class="jr"><thead><tr><th>Р.</th><th>Ты</th><th>${e.name}</th><th>Итог</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${next ? `<p class="adapt">В реванше: ${next.text}</p>` : ''}`;
  render();
  setTimeout(() => { if (G && G.phase === 'over') $('ovEnd').hidden = false; }, 700 * TS);
}

function renderHistory(){

function setCard(id, state, m, num){

function renderTable(){
  const ph = G.phase, y = G.you, f = G.foe, rec = U.rec;

  setCard('c-foe-i', f.intent && ph !== 'intent' ? 'up' : 'empty', f.intent);

  } else t.textContent = 'Раскрытие…';
}

function renderMoves(){
  const y = G.you, r = G.rules, ph = G.phase;

  else h.innerHTML = 'Бой окончен. В реванше соперник вспомнит, как ты играл.';
}

function previewHTML(m){
  const y = G.you, f = G.foe, r = G.rules, ph = G.phase;
  const rows = MOVES.map(e => {
    const shown = ph === 'action' && f.intent === e;

    return `<div class="pr ${cls}">${glyph(e)}<span>против: ${LOW[e]}${shown ? '<em>показал</em>' : ''}</span><b>${res}</b>${note}</div>`;
  }).join('');
  const foot = ph === 'intent' ? 'Без бонусов за слово — намерения ещё не показаны.' : (y.intent === m ? `С учётом +${r.bonus} за сдержанное слово.` : 'Ты меняешь намерение — бонуса не будет.');

$('moves').addEventListener('pointerdown', e => {
  const b = e.target.closest('.hc'); if (!b || b.disabled) return;
  lpFired = false; clearTimeout(lpTimer);
  if (e.pointerType !== 'mouse') lpTimer = setTimeout(() => { lpFired = true; showPreview(b); }, 330);
});
['pointerup', 'pointercancel'].forEach(t => $('moves').addEventListener(t, e => { if (e.pointerType !== 'mouse') hidePreview(); }));
$('moves').addEventListener('pointerover', e => { if (e.pointerType !== 'mouse') return; const b = e.target.closest('.hc'); if (b && !b.disabled) showPreview(b); });
$('moves').addEventListener('pointerleave', hidePreview);
$('moves').addEventListener('contextmenu', e => { if (e.target.closest('.hc')) e.preventDefault(); });
$('moves').addEventListener('click', e => {
  const b = e.target.closest('.hc');
  if (lpFired) { lpFired = false; return; }
  if (b && !b.disabled) { hidePreview(); onMove(b.dataset.m, b); }
});

/* ---------- кнопки и окна ---------- */
function closeAll(){ ['ovFoes', 'ovEnd', 'ovBal', 'ovFoe'].forEach(id => $(id).hidden = true); $('legendPop').hidden = true; }
function openFoes(){ closeAll(); renderFoesPanel(); $('ovFoes').hidden = false; }
$('hint').addEventListener('click', () => { if (skipFn) skipFn(); });
$('table').addEventListener('click', () => { if (skipFn) skipFn(); });
$('foeAva').addEventListener('click', () => { if (!G) return; renderFoeInfo(); $('ovFoe').hidden = false; });
$('btnSwitch').addEventListener('click', openFoes);
$('balFoes').addEventListener('click', openFoes);
$('btnLegend').addEventListener('click', e => {
  e.stopPropagation();
  const p = $('legendPop'); p.hidden = !p.hidden;
  $('btnLegend').setAttribute('aria-expanded', String(!p.hidden));
});
document.addEventListener('click', e => { if (!e.target.closest('#legendPop') && !e.target.closest('#btnLegend')) $('legendPop').hidden = true; });
$('btnBal').addEventListener('click', () => { renderBalance(); $('ovBal').hidden = false; });
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => { $(b.dataset.close).hidden = true; }));
document.querySelectorAll('.ov').forEach(o => o.addEventListener('click', e => { if (e.target === o && o.id !== 'ovEnd') o.hidden = true; }));
$('foesList').addEventListener('click', e => {
  if (e.target.id === 'forget') { S.mem = {}; saveSettings(); if (G) G.adapt = null; renderFoesPanel(); render(); return; }
  const c = e.target.closest('.foe-card'); if (c) newFight(c.dataset.e);
});
$('btnRematch').addEventListener('click', () => newFight(G.enemyId));
$('btnOther').addEventListener('click', openFoes);
$('balBody').addEventListener('click', e => {
  const b = e.target.closest('.sb'); if (!b) return;
  const d = RULE_DEFS.find(x => x.key === b.dataset.k);
  S.rules[d.key] = Math.max(d.min, Math.min(d.max, S.rules[d.key] + Number(b.dataset.d)));
  saveSettings(); renderBalance();
});
$('balBody').addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.v; if (!k) return;
  S.view[k] = e.target.checked; saveSettings(); render();
});
$('balApply').addEventListener('click', () => newFight(G ? G.enemyId : 'rock'));
$('balReset').addEventListener('click', () => { S.rules = {...RULES_V1}; S.view = {...VIEW_V1}; saveSettings(); renderBalance(); render(); });

function boot(data){
  if (data && data.G && data.G.phase !== 'reveal' && data.G.phase !== 'over') {
    G = data.G; G.rules = sanitize(G.rules); U = freshU(); render();
  } else newFight(S.last || 'rock');
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({G: G ? clone(G) : null})); } catch(e) {}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>

</body>

<title>Выдержка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Unbounded:wght@500;700&display=swap">
<style>
:root{
  color-scheme: light;
  --fog:#E3E7E2; --fog-2:#D2D9D4; --paper:#F5F6F2; --ink:#1B2327; --ink-2:#56625C; --ink-3:#8A958F; --line:#C3CCC6;
  --S:#D4532A; --P:#2A7C84; --F:#874AA6;
  --font-d:"Unbounded","Arial Black",system-ui,sans-serif;
  --font-b:"Onest","Segoe UI",system-ui,-apple-system,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--fog);color:var(--ink);font-family:var(--font-b);font-size:14px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:12px 20px;display:flex;flex-direction:column;gap:10px}

.top{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--font-d);font-weight:700;font-size:17px;line-height:1.1}
.brand small{display:block;font-family:var(--font-b);font-weight:500;font-size:10.5px;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.round{margin-left:auto;font-family:var(--font-d);font-weight:500;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:500;white-space:nowrap}
.tbtn:hover{border-color:var(--ink-2)}

.foe{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.foe-name{font-family:var(--font-d);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lvl{font-family:var(--font-b);font-weight:500;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.foe-hint{font-size:12px;color:var(--ink-2)}
.foe-adapt{font-size:12px;color:var(--ink);background:var(--paper);border-left:3px solid var(--ink);padding:4px 8px;margin-top:4px;border-radius:0 6px 6px 0}
.fch{display:flex;gap:6px}
.chip{display:flex;flex-direction:column;align-items:center;gap:1px;width:34px;padding:4px 0 5px;border-radius:9px;background:var(--paper);border:1px solid var(--line);position:relative}
.chip.declared{border-color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c)}
.chip .dot{width:18px;height:18px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.chip .dot .gl{width:12px;height:12px;stroke-width:3}
.chip b{font-family:var(--font-d);font-size:12.5px;font-variant-numeric:tabular-nums}
.chip .eye{position:absolute;top:-7px;right:-5px;width:16px;height:16px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.chip .eye .gl{width:11px;height:11px;stroke-width:2.4}

.pips{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.pips i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--c);box-sizing:border-box}
.pips i.on{background:var(--c)}
.pips.sm{gap:2px}
.pips.sm i{width:4px;height:4px;border-width:1px}

.hist{display:flex;gap:3px;align-items:stretch}
.hlab{display:flex;flex-direction:column;gap:3px;width:40px;flex:none}
.hlab span,.hcol .hn{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center}
.hlab span{flex:1}
.hlab span:last-child{flex:0 0 14px}
.hcol{flex:1 1 0;min-width:0;max-width:40px;display:flex;flex-direction:column;gap:3px;border-radius:9px;padding:2px;margin:-2px}
.hcol.now{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.hcol .hn{justify-content:center;flex:0 0 14px;font-variant-numeric:tabular-nums}
.hcol.now .hn{color:var(--ink);font-weight:700}
.cell{aspect-ratio:1;min-height:0;overflow:hidden;border-radius:7px;background:var(--paper);border:1px solid var(--line);position:relative;display:grid;place-items:center;color:var(--c)}
.cell.empty{background:transparent;border-style:dashed}
.cell>.gl{position:absolute;inset:22%;width:auto;height:auto;stroke-width:2.8}
.cell.won{background:color-mix(in srgb,var(--c) 22%,var(--paper));border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.cell.lost{opacity:.5}
.cell .was{position:absolute;top:1px;left:2px;width:38%;height:38%;color:var(--ink-2)}
.cell .was .gl{width:100%;height:100%;stroke-width:3}
.cell .was::after{content:"";position:absolute;left:-15%;right:-15%;top:48%;height:1.5px;background:var(--ink);transform:rotate(-40deg)}
.cell .dmg{position:absolute;bottom:0;right:3px;font-size:9px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}

.tug-row{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--ink-2)}
.tug-row b{font-family:var(--font-d);font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.tug-row .lead{margin-inline:auto;font-weight:700;color:var(--ink);font-size:12.5px}
.bar{position:relative;height:10px;border-radius:999px;background:var(--paper);border:1px solid var(--line);margin-top:4px;overflow:hidden}
.bar .fill{position:absolute;top:0;bottom:0;background:var(--ink);transition:left .5s,width .5s}
.bar .mid{position:absolute;left:50%;top:-1px;bottom:-1px;width:2px;margin-left:-1px;background:var(--ink-3)}
.two{display:flex;flex-direction:column;gap:5px}
.two .r{display:grid;grid-template-columns:70px 1fr 44px;gap:8px;align-items:center;font-size:12px;color:var(--ink-2)}
.two .r b{font-family:var(--font-d);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.two .hb{height:8px;border-radius:999px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.two .hb i{display:block;height:100%;background:var(--ink);transition:width .5s}

.stage{position:relative;aspect-ratio:2/1;max-width:100%;border-radius:16px;overflow:hidden;background:var(--fog-2);user-select:none}
.stage svg.scene{position:absolute;inset:0;width:100%;height:100%}
.fig .breath{animation:breathe 3.4s ease-in-out infinite}
.fig .body{transition:transform .26s cubic-bezier(.2,.9,.2,1)}
.fig .arm{transform-origin:0 0;transform-box:view-box;transition:transform .2s cubic-bezier(.2,.9,.2,1)}
.fig.pose-idle .arm{transform:rotate(30deg)}
.fig.pose-S .arm{transform:rotate(-2deg)}
.fig.pose-S .body{transform:translate(20px,0)}
.fig.pose-P .arm{transform:rotate(-80deg)}
.fig.pose-P .body{transform:translate(-4px,0)}
.fig.pose-F .arm{transform:rotate(55deg)}
.fig.pose-F .body{transform:translate(12px,5px)}
.hitwrap.hit{animation:hitk .4s}
.acc{display:none}
#fig-foe[data-e="rock"] .acc-rock,#fig-foe[data-e="hot"] .acc-hot,#fig-foe[data-e="fox"] .acc-fox{display:inline}
@keyframes breathe{50%{transform:translateY(1.4px)}}
@keyframes hitk{0%,100%{transform:translateX(0);opacity:1}20%{transform:translateX(-9px);opacity:.5}45%{transform:translateX(4px);opacity:1}65%{transform:translateX(-3px)}}

.slot{position:absolute;top:5%;display:flex;gap:6px;align-items:center;transform:translateX(-50%)}
.slot-you{left:31%}
.slot-foe{left:69%}
.ghost{width:30px;height:30px;border-radius:50%;border:1.5px dashed var(--c);color:var(--c);background:color-mix(in srgb,var(--paper) 72%,transparent);display:grid;place-items:center;position:relative}
.ghost .gl{width:17px;height:17px;opacity:.8;stroke-width:2.8}
.ghost .bl{display:none;position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:1px 5px;border-radius:4px}
.ghost.cracked{animation:crack .45s}
.ghost.cracked .bl{display:block}
.ghost.cracked .gl{opacity:.35}
.ghost.cracked::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:2px;margin-top:-1px;background:var(--ink);transform:rotate(-40deg)}
@keyframes crack{20%{transform:translateX(-3px) rotate(-6deg)}40%{transform:translateX(3px) rotate(4deg)}60%{transform:translateX(-2px)}}
.card{width:30px;height:40px;perspective:300px}
.cin{position:relative;width:100%;height:100%;transition:transform .42s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.card.flipped .cin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center}
.face.back{background:var(--ink) repeating-linear-gradient(45deg,transparent 0 4px,rgba(245,246,242,.12) 4px 5px);border:1.5px solid var(--paper)}
.face.front{transform:rotateY(180deg);background:var(--c);color:#fff;border:1.5px solid var(--paper)}
.face.front .gl{width:19px;height:19px;stroke-width:3}
.flash{position:absolute;inset:0;background:var(--c,#fff);opacity:0;pointer-events:none}
.flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.35}100%{opacity:0}}
.pop{position:absolute;top:36%;transform:translateX(-50%);font-family:var(--font-d);font-weight:700;font-size:24px;color:var(--ink);text-shadow:0 1px 0 var(--paper),0 0 8px var(--paper);animation:popup 1.4s forwards;pointer-events:none;white-space:nowrap}
.pop.note{font-family:var(--font-b);font-size:11px;font-weight:700;text-shadow:none;background:var(--ink);color:var(--paper);padding:2px 7px;border-radius:6px;top:58%}
@keyframes popup{0%{opacity:0;transform:translate(-50%,8px)}14%{opacity:1;transform:translate(-50%,0)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}

.prompt{min-height:62px;display:flex;flex-direction:column;gap:3px;cursor:default}
.ph{align-self:flex-start;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:2px 8px;border-radius:999px}
.ph.res{background:var(--paper);color:var(--ink);border:1px solid var(--ink)}
.prompt p{margin:0;font-size:13.5px;text-wrap:pretty}
.prompt .skip{font-size:11px;color:var(--ink-3)}

.moves{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mv{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 4px 10px;border-radius:16px;border:1.5px solid color-mix(in srgb,var(--c) 45%,var(--line));background:color-mix(in srgb,var(--c) var(--mix),var(--paper));transition:transform .15s,background .45s}
.mv:not(:disabled):hover{border-color:var(--c)}
.mv:not(:disabled):active{transform:scale(.97)}
.mv:disabled{cursor:default}
.mv.declared{box-shadow:inset 0 0 0 2px var(--c)}
.mv.chosen{box-shadow:inset 0 0 0 2px var(--c),0 0 0 3px var(--ink)}
.mv.full::before{content:"";position:absolute;inset:-5px;border-radius:20px;border:2px solid var(--c);opacity:0;animation:ring 1.8s ease-out infinite;pointer-events:none}
@keyframes ring{0%{opacity:.7;transform:scale(.97)}100%{opacity:0;transform:scale(1.03)}}
.badge{width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.badge .gl{width:23px;height:23px;stroke-width:2.8}
.mv.inhale .badge{animation:inhale .8s ease-out}
.mv.exhale .badge{animation:exhale .8s ease-out}
@keyframes inhale{40%{transform:scale(1.18);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 25%,transparent)}}
@keyframes exhale{40%{transform:scale(.82);opacity:.6}}
.mn{font-weight:700;font-size:clamp(11px,3.1vw,13px);margin-top:4px}
.pw{font-family:var(--font-d);font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;display:flex;align-items:flex-start;gap:2px}
.pw em{font-style:normal;font-family:var(--font-b);font-size:10.5px;background:var(--ink);color:var(--paper);border-radius:6px;padding:1px 4px;margin-top:3px}
.pl{font-size:9.5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;text-align:center;line-height:1.2}
.mv .pips{margin-top:5px}
.tag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:10px;font-weight:500;padding:2px 7px;border-radius:999px;display:flex;gap:4px;align-items:center;white-space:nowrap}
.tag .gl{width:11px;height:11px;stroke-width:2.4}
.you-lab{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}

.gl{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;display:block}

.ov{position:fixed;inset:0;z-index:10;background:rgba(27,35,39,.5);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-top:calc(16px + env(safe-area-inset-top,0px))}
.panel{background:var(--paper);width:100%;max-width:440px;max-height:100%;overflow:auto;border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(27,35,39,.3)}
.panel h2{font-family:var(--font-d);font-weight:700;font-size:20px;margin:0;text-wrap:balance}
.panel h3{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);margin:4px 0 0}
.panel p{margin:0}
.ph-row{display:flex;align-items:center;gap:10px}
.x{margin-left:auto;border:0;background:transparent;font-size:22px;line-height:1;padding:4px 8px;color:var(--ink-2)}
.rules-mini{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}
.tri{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;color:var(--ink);font-weight:500}
.tri .t{display:inline-flex;align-items:center;gap:5px}
.tri .d{width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.tri .d .gl{width:12px;height:12px;stroke-width:3}
.foes{display:flex;flex-direction:column;gap:8px}
.foe-card{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:1px solid var(--line);background:var(--fog);border-radius:14px;padding:12px 14px}
.foe-card:hover{border-color:var(--ink)}
.foe-card.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.foe-card b{font-family:var(--font-d);font-size:15px}
.foe-card .rec{font-size:11px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.foe-card .h{grid-column:1/-1;font-size:12.5px;color:var(--ink-2)}
.foe-card .a{grid-column:1/-1;font-size:12px;color:var(--ink);margin-top:3px}
.big{font-family:var(--font-d);font-weight:700;font-size:30px;line-height:1.1}
.score{display:flex;gap:16px;font-size:13px;color:var(--ink-2)}
.score b{font-family:var(--font-d);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.stats{display:flex;flex-direction:column;gap:4px;font-size:13px}
.stats div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:3px}
.stats span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.log-wrap{overflow-x:auto}
table.log{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
.log th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);text-align:left;font-weight:500;padding:4px 4px}
.log td{padding:5px 4px;border-top:1px solid var(--line);white-space:nowrap}
.pair{display:inline-flex;align-items:center;gap:3px}
.pair .gl{width:14px;height:14px;stroke-width:2.8}
.pair .ar{color:var(--ink-3)}
.pair.bl{background:color-mix(in srgb,var(--ink) 8%,transparent);border-radius:5px;padding:0 3px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 auto;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:12px;padding:11px 14px;font-weight:700;font-size:13.5px}
.btn.alt{background:transparent;color:var(--ink)}
.st{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.sl{font-size:13px}
.sl small{display:block;font-size:11px;color:var(--ink-3)}
.ctl{display:flex;align-items:center;gap:4px;flex:none}
.sb{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--fog);font-size:17px;line-height:1}
.sb:hover{border-color:var(--ink)}
.ctl output{min-width:30px;text-align:center;font-family:var(--font-d);font-weight:700;font-variant-numeric:tabular-nums}
.ctl output.chg{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.inv{font-size:12.5px;background:var(--fog);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.inv b{font-variant-numeric:tabular-nums}
.inv .ok{color:var(--P);font-weight:700}
.inv .warn{color:var(--S);font-weight:700}
.sw{display:flex;align-items:flex-start;gap:10px;font-size:13px;padding:5px 0;cursor:pointer}
.sw input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--ink);flex:none}
.sw small{display:block;font-size:11px;color:var(--ink-3)}
.note{font-size:12px;color:var(--ink-2)}
.linkish{border:0;background:none;padding:0;text-decoration:underline;font-size:12px;color:var(--ink-2);align-self:flex-start}

@media (prefers-reduced-motion: reduce){
  .fig .breath,.mv.full::before{animation:none}
  .fig .body,.fig .arm,.cin{transition-duration:.01s}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="g-S" viewBox="0 0 24 24"><path d="M3 12h15"/><path d="M12 5l7 7-7 7"/></symbol>
  <symbol id="g-P" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.6-3 8-7 10-4-2-7-5.4-7-10V6z"/></symbol>
  <symbol id="g-F" viewBox="0 0 24 24"><path d="M4 18c5 0 4-11 10-11h5"/><path d="M16 4l3 3-3 3"/></symbol>
  <symbol id="g-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></symbol>
</svg>

<div class="app">
  <header class="top">
    <div class="brand">Выдержка<small>прототип</small></div>
    <div class="round" id="round">Раунд 1 / 10</div>
    <button class="tbtn" id="btnFoes" type="button">Соперники</button>
    <button class="tbtn" id="btnBal" type="button">Баланс</button>
  </header>

  <section class="foe" aria-label="Соперник">
    <div>
      <div class="foe-name" id="foeName"></div>
      <div class="foe-hint" id="foeHint"></div>
      <div class="foe-adapt" id="foeAdapt" hidden></div>
    </div>
    <div class="fch" id="foeCh"></div>
  </section>

  <section class="hist" id="hist" aria-label="История раундов"></section>

  <section id="tug" aria-label="Здоровье"></section>

  <section class="stage" id="stage">
    <svg class="scene" viewBox="0 0 360 180" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#C6D0CB"/><stop offset="1" stop-color="#EEF0EB"/>
        </linearGradient>
      </defs>
      <rect width="360" height="180" fill="url(#sky)"/>
      <circle cx="290" cy="46" r="18" fill="#F5F6F2" opacity=".7"/>
      <path d="M0 118 C40 98 70 106 110 94 C150 82 180 102 220 92 C260 82 300 98 360 88 L360 180 L0 180Z" fill="#A9B5AF" opacity=".45"/>
      <path d="M0 140 C60 128 120 136 180 130 C240 124 300 134 360 128 L360 180 L0 180Z" fill="#94A29B" opacity=".45"/>
      <rect y="165" width="360" height="15" fill="#C3CCC6"/>
      <rect y="165" width="360" height="1.5" fill="#1B2327"/>
      <ellipse cx="112" cy="166" rx="28" ry="3.5" fill="#1B2327" opacity=".2"/>
      <ellipse cx="248" cy="166" rx="28" ry="3.5" fill="#1B2327" opacity=".2"/>

      <g transform="translate(112 165)">
        <g class="fig pose-idle" id="fig-you">
          <g class="breath"><g class="hitwrap" id="hit-you"><g class="body">
            <path d="M-3 -42 L-17 0 M3 -42 L15 0" stroke="#1B2327" stroke-width="7" stroke-linecap="round" fill="none"/>
            <path d="M-13 -80 Q0 -86 13 -80 L9 -42 L-9 -42Z" fill="#1B2327"/>
            <circle cx="1" cy="-94" r="10" fill="#1B2327"/>
            <path d="M-8 -97 L-22 -91 M-8 -97 L-20 -101" stroke="#1B2327" stroke-width="2.5" stroke-linecap="round" fill="none"/>

            <path d="M-6 -74 L-17 -58" stroke="#1B2327" stroke-width="6" stroke-linecap="round" fill="none"/>

              <path d="M26 0 L72 0" stroke="#1B2327" stroke-width="2.4" stroke-linecap="round" fill="none"/>

      <button class="btn alt" type="button" id="balReset">Вернуть 1.0</button>

<script>
(() => {
const KEY = 'vyderzhka-proto-v1';
const MOVES = ['S','P','F'];
const NAME = {S:'Удар', P:'Парирование', F:'Финт'};
const LOW = {S:'удар', P:'парирование', F:'финт'};
const BEATS = {S:'F', P:'S', F:'P'};
const COUNTER = {S:'P', P:'F', F:'S'};
const VERB = {S:'Удар бьёт финт', P:'Парирование ловит удар', F:'Финт обманывает парирование'};
const RULES_V1 = {rounds:10, hp:40, start:2, reset:1, growth:1, max:5, bonus:1};
const VIEW_V1 = {showDamage:true, fullHistory:true, tug:true};
const RULE_DEFS = [
  {key:'rounds', label:'Раундов в бою', min:3, max:20},
  {key:'hp', label:'Здоровье', min:5, max:99},
  {key:'start', label:'Стартовая сила приёма', min:1, max:12},
  {key:'reset', label:'Сила после использования', min:0, max:12},
  {key:'growth', label:'Рост неиспользованного', note:'за раунд', min:0, max:5},
  {key:'max', label:'Максимум силы', min:1, max:12},
  {key:'bonus', label:'Бонус за сдержанное слово', note:'к урону при победе в обмене', min:0, max:5},
];
const VIEW_DEFS = [
  {key:'showDamage', label:'Урон при победе на кнопках', note:'выкл — только текущая сила'},
  {key:'fullHistory', label:'История всех раундов', note:'выкл — последние 3, как в документе'},
  {key:'tug', label:'Перевес одной полосой', note:'выкл — две полоски здоровья'},
];

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, reduce ? Math.min(ms, 80) : ms));
const $ = id => document.getElementById(id);
const rnd = Math.random;
const pick = a => a[Math.floor(rnd() * a.length)];
const glyph = (m, cls='') => `<svg class="gl ${cls}" aria-hidden="true"><use href="#g-${m}"/></svg>`;
const pct = x => Math.round(x * 100) + '%';
const clone = o => JSON.parse(JSON.stringify(o));

function loadSettings(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const o = JSON.parse(raw);
      return {rules:{...RULES_V1, ...o.rules}, view:{...VIEW_V1, ...o.view}, mem:o.mem || {}, last:o.last || 'rock'};
    }
  } catch(e) {}
  return {rules:{...RULES_V1}, view:{...VIEW_V1}, mem:{}, last:'rock'};
}
function saveSettings(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
const S = loadSettings();

function argmax(ch){ const top = Math.max(...MOVES.map(m => ch[m])); return pick(MOVES.filter(m => ch[m] === top)); }
function weighted(ch){
  const w = MOVES.map(m => ch[m] * ch[m] + .5);
  let t = rnd() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < 3; i++) { t -= w[i]; if (t <= 0) return MOVES[i]; }
  return 'F';
}

const ENEMIES = [
  {id:'rock', name:'Скала', level:'учебный',
   hint:'Всегда делает то, что показал. Показывает самый заряженный приём.',
   declare: me => argmax(me.ch),
   act: c => c.myIntent},
  {id:'hot', name:'Горячий', level:'средний',
   hint:'Не выдерживает, когда удар заряжен до 4+. В остальное время часто отвечает на твоё намерение.',
   declare: me => me.ch.S >= 4 ? 'S' : weighted(me.ch),
   act: c => {
     if (c.myIntent === 'S' && c.me.ch.S >= 4 && rnd() < .9) return 'S';
     if (rnd() < .6) return COUNTER[c.yourIntent];
     return c.myIntent;
   }},
  {id:'fox', name:'Лис', level:'хитрый',
   hint:'Часто показывает одно, а делает другое. Но не всегда.',
   declare: me => weighted(me.ch),
   act: c => rnd() < .6 ? COUNTER[COUNTER[c.myIntent]] : c.myIntent},
];
const enemyById = id => ENEMIES.find(e => e.id === id) || ENEMIES[0];

function computeAdapt(id){
  const m = S.mem[id];
  if (!m || !m.fights) return null;
  const e = enemyById(id);
  if (id === 'rock') return {kind:'favorite', move:m.favorite,
    text:`${e.name} запомнил: в прошлом бою ты чаще всего играл «${LOW[m.favorite]}». Теперь он чаще показывает то, что это бьёт.`};
  if (m.bluffRate >= .4) return {kind:'distrust',
    text:`${e.name} заметил, что ты часто меняешь намерение (${pct(m.bluffRate)} раундов), и перестал ему верить.`};
  if (m.bluffRate <= .2) return {kind:'trust',
    text:`${e.name} заметил, что ты почти всегда держишь слово (блеф в ${pct(m.bluffRate)} раундов), и теперь чаще отвечает на твоё намерение.`};
  return {kind:'none', text:`${e.name} не нашёл в твоей прошлой игре явной привычки.`};
}

function enemyDeclare(){
  const e = enemyById(G.enemyId);
  if (G.adapt && G.adapt.kind === 'favorite' && rnd() < .6) return COUNTER[G.adapt.move];
  return e.declare(G.foe);
}
function enemyAct(){
  const e = enemyById(G.enemyId);
  const c = {me:G.foe, myIntent:G.foe.intent, yourIntent:G.you.intent};
  if (G.adapt && G.adapt.kind === 'trust' && rnd() < .45) return COUNTER[c.yourIntent];
  if (G.adapt && G.adapt.kind === 'distrust' && rnd() < .45) return c.yourIntent;
  return e.act(c);
}

function sanitize(r){
  const o = {...r};
  o.start = Math.min(o.start, o.max);
  o.reset = Math.min(o.reset, o.max);
  return o;
}

function maxDamageByRound(r0){
  const r = sanitize(r0);
  const best = [0];
  let cur = new Map([[`${r.start},${r.start},${r.start}`, 0]]);
  for (let k = 1; k <= r.rounds; k++) {
    const nx = new Map();
    for (const [key, v] of cur) {
      const c = key.split(',').map(Number);
      for (let j = 0; j < 3; j++) {
        const g = v + c[j] + r.bonus;
        const n = c.map((x, t) => t === j ? r.reset : Math.min(r.max, x + r.growth));
        const nk = n.join(',');
        if (!(nx.get(nk) >= g)) nx.set(nk, g);
      }
    }
    cur = nx;
    let b = 0; for (const v of cur.values()) b = Math.max(b, v);
    best.push(b);
  }
  return best;
}

let G = null;
let U = null;
let skipFn = null;
const freshU = () => ({revealed:false, pose:{you:'idle', foe:'idle'}, breath:{}, outcome:null});

function side(r){ return {hp:r.hp, ch:{S:r.start, P:r.start, F:r.start}, intent:null, action:null}; }

function newFight(enemyId){
  const r = sanitize(S.rules);
  S.last = enemyId; saveSettings();
  G = {rules:r, enemyId, round:1, phase:'intent', you:side(r), foe:side(r), log:[], adapt:computeAdapt(enemyId)};
  U = freshU();
  skipFn = null;
  closeAll();
  render();
}

function onMove(m){
  if (!G) return;
  if (G.phase === 'intent') {
    G.you.intent = m;
    G.foe.intent = enemyDeclare();
    G.phase = 'action';
    render();
  } else if (G.phase === 'action') {
    G.you.action = m;
    G.foe.action = enemyAct();
    G.phase = 'reveal';
    runReveal();
  }
}

function grow(s){
  const r = G.rules, out = {};
  MOVES.forEach(m => {
    const before = s.ch[m];
    s.ch[m] = m === s.action ? r.reset : Math.min(r.max, before + r.growth);
    out[m] = s.ch[m] > before ? 'inhale' : (s.ch[m] < before ? 'exhale' : '');
  });
  return out;
}

function waitOrTap(ms){
  return new Promise(res => {
    const t = setTimeout(done, reduce ? 700 : ms);
    function done(){ clearTimeout(t); skipFn = null; res(); }
    skipFn = done;
  });
}

function restartAnim(el, cls){ el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls); }

function pop(who, text, cls=''){
  const el = document.createElement('div');
  el.className = 'pop ' + cls;
  el.textContent = text;
  el.style.left = who === 'you' ? '31%' : '69%';
  $('stage').appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

async function runReveal(){
  const g = G, y = G.you, f = G.foe, r = G.rules;
  const rec = {round:G.round, you:{intent:y.intent, action:y.action, ch:{...y.ch}}, foe:{intent:f.intent, action:f.action, ch:{...f.ch}}, winner:null, dmg:0, bonus:false};
  if (y.action !== f.action) {
    const youWin = BEATS[y.action] === f.action;
    rec.winner = youWin ? 'you' : 'foe';
    const w = youWin ? y : f;
    rec.bonus = w.intent === w.action && r.bonus > 0;
    rec.dmg = w.ch[w.action] + (w.intent === w.action ? r.bonus : 0);
  }
  U.revealed = false;
  render();
  await sleep(420);
  if (G !== g) return;

  U.revealed = true;
  U.pose = {you:y.action, foe:f.action};
  renderStage();
  await sleep(380);
  if (G !== g) return;

  if (rec.winner) {
    const loser = rec.winner === 'you' ? 'foe' : 'you';
    G[loser].hp -= rec.dmg;
    $('flash').style.setProperty('--c', `var(--${G[rec.winner].action})`);
    restartAnim($('flash'), 'go');
    restartAnim($('hit-' + loser), 'hit');
    pop(loser, '−' + rec.dmg);
    if (rec.bonus) pop(rec.winner, `+${r.bonus} за слово`, 'note');
  } else {
    pop('you', '0'); pop('foe', '0');
  }
  if (y.intent !== y.action && rec.winner === 'you') pop('you', 'блеф сработал', 'note');
  if (f.intent !== f.action && rec.winner === 'you') pop('foe', 'пойман', 'note');

  U.breath = grow(y);
  grow(f);
  G.log.push(rec);
  U.outcome = rec;
  render();

  await waitOrTap(2100);
  if (G !== g) return;

  const over = G.round >= r.rounds || y.hp <= 0 || f.hp <= 0;
  if (over) { endFight(); return; }
  G.round++;
  y.intent = y.action = f.intent = f.action = null;
  G.phase = 'intent';
  U = freshU();
  render();
}

function outcomeText(rec){
  const y = rec.you, f = rec.foe, parts = [];
  if (!rec.winner) {
    parts.push(`Оба сыграли «${LOW[y.action]}». Урона нет.`);
  } else {
    const w = rec[rec.winner];
    const base = w.ch[w.action];
    const how = rec.bonus ? ` (${base} + ${G.rules.bonus} за сдержанное слово)` : '';
    parts.push(`${VERB[w.action]}. ${rec.winner === 'you' ? 'Соперник теряет' : 'Ты теряешь'} ${rec.dmg}${how}.`);
  }
  if (f.intent !== f.action) parts.push(`Соперник блефовал: показал ${LOW[f.intent]}, сыграл ${LOW[f.action]}.`);
  if (y.intent !== y.action) parts.push(rec.winner === 'you' ? 'Твой блеф сработал.' : (rec.winner ? 'Твой блеф не сработал.' : ''));
  return parts.filter(Boolean).join(' ');
}

function endFight(){
  G.phase = 'over';
  const y = G.you, f = G.foe, log = G.log, n = log.length;
  const res = y.hp > f.hp ? 'win' : (y.hp < f.hp ? 'lose' : 'draw');
  const myBluffs = log.filter(l => l.you.intent !== l.you.action);
  const foeBluffs = log.filter(l => l.foe.intent !== l.foe.action);
  const cnt = {S:0, P:0, F:0}; log.forEach(l => cnt[l.you.action]++);
  const favorite = argmax(cnt);
  const prev = S.mem[G.enemyId] || {fights:0, w:0, l:0, d:0};
  S.mem[G.enemyId] = {fights:prev.fights + 1, w:prev.w + (res==='win'), l:prev.l + (res==='lose'), d:prev.d + (res==='draw'), bluffRate: n ? myBluffs.length / n : 0, favorite};
  saveSettings();
  const next = computeAdapt(G.enemyId);
  const e = enemyById(G.enemyId);
  const title = {win:'Победа', lose:'Поражение', draw:'Ничья'}[res];
  const pair = (s) => `<span class="pair ${s.intent !== s.action ? 'bl' : ''}" style="color:var(--${s.intent})">${glyph(s.intent)}</span><span class="pair ar">→</span><span class="pair" style="color:var(--${s.action})">${glyph(s.action)}</span>`;
  const rows = log.map(l => `<tr><td>${l.round}</td><td>${pair(l.you)}</td><td>${pair(l.foe)}</td><td>${l.winner ? (l.winner === 'you' ? `−${l.dmg} сопернику` : `−${l.dmg} тебе`) : 'ничья'}${l.bonus ? ' · слово' : ''}</td></tr>`).join('');
  $('endBody').innerHTML = `
    <div class="ph-row"><div class="big" id="endTitle">${title}</div></div>
    <div class="score"><span>Ты <b>${y.hp}</b></span><span>${e.name} <b>${f.hp}</b></span></div>
    <div class="stats">
      <div><span>Твоих блефов</span><span>${myBluffs.length} из ${n}, сработали ${myBluffs.filter(l => l.winner === 'you').length}</span></div>
      <div><span>Блефов соперника</span><span>${foeBluffs.length}, ты поймал ${foeBluffs.filter(l => l.winner === 'you').length}</span></div>
      <div><span>Сдержал слово и выиграл обмен</span><span>${log.filter(l => l.winner === 'you' && l.bonus).length}</span></div>
    </div>
    <h3>Журнал боя · показал → сыграл</h3>
    <div class="log-wrap"><table class="log"><thead><tr><th>Р.</th><th>Ты</th><th>${e.name}</th><th>Итог</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${next ? `<p class="foe-adapt">В реванше: ${next.text}</p>` : ''}`;
  render();
  $('ovEnd').hidden = false;
}

function render(){
  if (!G) return;
  renderTop(); renderFoe(); renderHistory(); renderTug(); renderStage(); renderPrompt(); renderMoves();
}

function renderTop(){
  const R = G.rules.rounds;
  $('round').textContent = G.phase === 'over' ? 'Бой окончен' : `Раунд ${G.round} / ${R}`;
}

function renderFoe(){
  const e = enemyById(G.enemyId);
  $('foeName').innerHTML = `${e.name} <span class="lvl">${e.level}</span>`;
  $('foeHint').textContent = e.hint;
  const a = $('foeAdapt');
  a.hidden = !G.adapt;
  if (G.adapt) a.textContent = G.adapt.text;
  const f = G.foe, r = G.rules;
  const showDecl = G.phase === 'action' || G.phase === 'reveal';
  $('foeCh').innerHTML = MOVES.map(m => {
    const pips = Array.from({length:r.max}, (_, i) => `<i class="${i < f.ch[m] ? 'on' : ''}"></i>`).join('');
    const d = showDecl && f.intent === m;
    return `<div class="chip ${d ? 'declared' : ''}" style="--c:var(--${m})" title="${NAME[m]}: сила ${f.ch[m]}"><span class="dot">${glyph(m)}</span><b>${f.ch[m]}</b><span class="pips sm">${pips}</span>${d ? `<span class="eye">${glyph('eye')}</span>` : ''}</div>`;
  }).join('');
  $('fig-foe').setAttribute('data-e', e.id);
}

function cell(s, rec, who){
  if (!rec) return `<div class="cell empty"></div>`;
  const won = rec.winner === who, lost = rec.winner && !won, bluff = s.intent !== s.action;
  const t = `${who === 'you' ? 'Ты' : 'Соперник'}: показал ${LOW[s.intent]}, сыграл ${LOW[s.action]}`;
  return `<div class="cell ${won ? 'won' : ''} ${lost ? 'lost' : ''}" style="--c:var(--${s.action})" title="${t}">${glyph(s.action)}${bluff ? `<span class="was">${glyph(s.intent)}</span>` : ''}${won ? `<span class="dmg">${rec.dmg}</span>` : ''}</div>`;
}

function renderHistory(){
  const R = G.rules.rounds;
  const cur = G.phase === 'over' ? R + 1 : G.round;
  let cols = [];
  if (S.view.fullHistory) cols = Array.from({length:R}, (_, i) => i + 1);
  else { for (let n = Math.max(1, cur - 3); n <= Math.min(cur, R); n++) cols.push(n); }
  const byRound = {}; G.log.forEach(l => byRound[l.round] = l);
  $('hist').innerHTML = `<div class="hlab"><span>Соп.</span><span>Ты</span><span></span></div>` +
    cols.map(n => {
      const rec = byRound[n];
      return `<div class="hcol ${n === cur ? 'now' : ''}">${cell(rec && rec.foe, rec, 'foe')}${cell(rec && rec.you, rec, 'you')}<span class="hn">${n}</span></div>`;
    }).join('');
}

function renderTug(){
  const y = G.you.hp, f = G.foe.hp, H = G.rules.hp;
  if (S.view.tug) {
    const lead = y - f;
    const w = Math.min(50, Math.abs(lead) / H * 100);
    const left = lead > 0 ? 50 - w : 50;
    const txt = lead === 0 ? 'Поровну' : (lead > 0 ? `Ты впереди на ${lead}` : `Соперник впереди на ${-lead}`);
    $('tug').innerHTML = `<div class="tug-row"><span><b>${y}</b> ты</span><span class="lead">${txt}</span><span>соперник <b>${f}</b></span></div>
      <div class="bar"><i class="fill" style="left:${left}%;width:${w}%"></i><i class="mid"></i></div>`;
  } else {
    const row = (lab, v) => `<div class="r"><span>${lab}</span><div class="hb"><i style="width:${Math.max(0, v) / H * 100}%"></i></div><b>${v}/${H}</b></div>`;
    $('tug').innerHTML = `<div class="two">${row('Ты', y)}${row('Соперник', f)}</div>`;
  }
}

function renderStage(){
  const ph = G.phase;
  ['you', 'foe'].forEach(w => {
    const s = G[w], gh = $('ghost-' + w), cd = $('card-' + w);
    const showGhost = !!s.intent && (ph === 'action' || ph === 'reveal');
    gh.hidden = !showGhost;
    if (showGhost) {
      gh.style.setProperty('--c', `var(--${s.intent})`);
      gh.innerHTML = glyph(s.intent) + '<span class="bl">блеф</span>';
      gh.title = `Показал: ${LOW[s.intent]}`;
      gh.classList.toggle('cracked', U.revealed && s.action !== s.intent);
    }
    cd.hidden = ph !== 'reveal';
    if (ph === 'reveal') {
      cd.style.setProperty('--c', `var(--${s.action})`);
      cd.querySelector('.front').innerHTML = glyph(s.action);
      cd.classList.toggle('flipped', U.revealed);
    }
    $('fig-' + w).setAttribute('class', 'fig pose-' + (U.pose[w] || 'idle'));
  });
}

function renderPrompt(){
  const p = $('prompt'), r = G.rules;
  if (G.phase === 'intent') {
    p.innerHTML = `<span class="ph">Фаза 1 · намерение</span><p>Покажи приём, который собираешься сыграть. Соперник показывает свой одновременно.</p>`;
  } else if (G.phase === 'action') {
    const bonus = r.bonus ? ` (+${r.bonus} к урону, если выиграешь обмен)` : '';
    p.innerHTML = `<span class="ph">Фаза 2 · действие</span><p>Соперник показал <b>${LOW[G.foe.intent]}</b>. Нажми «${NAME[G.you.intent]}» ещё раз, чтобы сдержать слово${bonus}, или смени приём.</p>`;
  } else if (G.phase === 'reveal') {
    p.innerHTML = U.outcome
      ? `<span class="ph res">Итог раунда ${U.outcome.round}</span><p>${outcomeText(U.outcome)}</p><span class="skip">Нажми сюда или на сцену, чтобы продолжить</span>`
      : `<span class="ph res">Раскрытие</span><p>Карты легли рубашкой вверх…</p>`;
  } else {
    p.innerHTML = `<span class="ph res">Бой окончен</span><p>Реванш или другой соперник — в итогах боя.</p>`;
  }
}

function renderMoves(){
  const y = G.you, r = G.rules, ph = G.phase;
  $('youHint').textContent = ph === 'action' ? 'цифра — урон, если выиграешь' : 'цифра — сила приёма';
  if (ph === 'action' && !S.view.showDamage) $('youHint').textContent = 'цифра — сила приёма';
  $('moves').innerHTML = MOVES.map(m => {
    const ch = y.ch[m];
    const k = r.max > 1 ? Math.max(0, (ch - 1) / (r.max - 1)) : 1;
    const mix = Math.round(6 + k * 36);
    const declared = y.intent === m && ph !== 'intent';
    const chosen = ph === 'reveal' && y.action === m;
    let big = ch, lab = 'сила', plus = '';
    if (ph === 'action' && S.view.showDamage) {
      big = ch + (declared ? r.bonus : 0);
      lab = 'урон при победе';
      if (declared && r.bonus) plus = `<em>+${r.bonus}</em>`;
    }
    const pips = Array.from({length:r.max}, (_, i) => `<i class="${i < ch ? 'on' : ''}"></i>`).join('');
    const disabled = ph === 'reveal' || ph === 'over';
    return `<button type="button" class="mv ${ch >= r.max ? 'full' : ''} ${declared ? 'declared' : ''} ${chosen ? 'chosen' : ''} ${U.breath[m] || ''}" data-m="${m}" style="--c:var(--${m});--mix:${mix}%" ${disabled ? 'disabled' : ''} aria-label="${NAME[m]}, сила ${ch}">
      ${declared ? `<span class="tag">${glyph('eye')} показал</span>` : ''}
      <span class="badge">${glyph(m)}</span>
      <span class="mn">${NAME[m]}</span>
      <span class="pw"><b>${big}</b>${plus}</span>
      <span class="pl">${lab}</span>
      <span class="pips">${pips}</span>
    </button>`;
  }).join('');
}

function renderFoesPanel(){
  const r = sanitize(S.rules);
  const t = m => `<span class="t" style="--c:var(--${m})"><span class="d">${glyph(m)}</span>${NAME[m]}</span>`;
  $('rulesMini').innerHTML = `
    <div class="tri">${t('S')} бьёт ${t('F')}</div>
    <div class="tri">${t('F')} обманывает ${t('P')}</div>
    <div class="tri">${t('P')} ловит ${t('S')}</div>
    <p>Каждый раунд оба сначала показывают намерение, потом тайно делают настоящий ход. Сдержал слово и выиграл обмен — +${r.bonus} к урону. Неиспользованные приёмы копят силу до ${r.max}, использованный падает до ${r.reset}. После ${r.rounds} раундов побеждает тот, у кого больше здоровья.</p>`;
  $('foesList').innerHTML = ENEMIES.map(e => {
    const m = S.mem[e.id];
    const rec = m && m.fights ? `${m.w}–${m.l}${m.d ? '–' + m.d : ''}` : 'не встречались';
    const a = computeAdapt(e.id);
    return `<button type="button" class="foe-card ${G && G.enemyId === e.id ? 'cur' : ''}" data-e="${e.id}">
      <b>${e.name}</b><span class="rec">${rec}</span>
      <span class="h">${e.level[0].toUpperCase() + e.level.slice(1)}. ${e.hint}</span>
      ${a ? `<span class="a">${a.text}</span>` : ''}
    </button>`;
  }).join('') + `<button type="button" class="linkish" id="forget">Стереть память соперников</button>`;
}

function renderBalance(){
  const r = S.rules;
  const best = maxDamageByRound(r);
  const sr = sanitize(r);
  const R = sr.rounds;
  let ko = null;
  for (let k = 1; k <= R; k++) if (best[k] >= sr.hp) { ko = k; break; }
  const status = ko === null
    ? `<span class="ok">Нокаута нет вообще: бой всегда идёт ${R} раундов.</span>`
    : ko === R
      ? `<span class="ok">Нокаут возможен только в последнем раунде — бой всегда доигрывается.</span>`
      : `<span class="warn">Нокаут возможен уже в ${ko}-м раунде — бой может закончиться раньше.</span>`;
  const changed = G && JSON.stringify(sr) !== JSON.stringify(G.rules);
  $('balBody').innerHTML = `
    <h3>Правила боя</h3>
    <div>${RULE_DEFS.map(d => `<div class="st"><span class="sl">${d.label}${d.note ? `<small>${d.note}</small>` : ''}</span>
      <div class="ctl"><button type="button" class="sb" data-k="${d.key}" data-d="-1" aria-label="${d.label}: меньше">−</button>
      <output id="rv-${d.key}" class="${r[d.key] !== RULES_V1[d.key] ? 'chg' : ''}">${r[d.key]}</output>
      <button type="button" class="sb" data-k="${d.key}" data-d="1" aria-label="${d.label}: больше">+</button></div></div>`).join('')}</div>
    <div class="inv">
      <span>Максимум урона одного бойца: за ${R - 1} р. — <b>${best[R - 1]}</b>, за ${R} — <b>${best[R]}</b>. Здоровье <b>${sr.hp}</b>.</span>
      ${status}
      <span class="note">Считается перебором всех состояний зарядов, если боец выигрывает каждый обмен и всегда держит слово.</span>
    </div>
    <p class="note">${changed ? 'Правила изменены — применятся в новом бою.' : 'Подчёркнуто — отличается от версии 1.0.'}</p>
    <h3>Вид</h3>
    <div>${VIEW_DEFS.map(d => `<label class="sw"><input type="checkbox" id="v-${d.key}" data-v="${d.key}" ${S.view[d.key] ? 'checked' : ''}><span>${d.label}<small>${d.note}</small></span></label>`).join('')}</div>`;
}

function closeAll(){ ['ovFoes', 'ovEnd', 'ovBal'].forEach(id => $(id).hidden = true); }

$('moves').addEventListener('click', e => {
  const b = e.target.closest('.mv');
  if (b && !b.disabled) onMove(b.dataset.m);
});
$('prompt').addEventListener('click', () => { if (skipFn) skipFn(); });
$('stage').addEventListener('click', () => { if (skipFn) skipFn(); });
$('btnFoes').addEventListener('click', () => { renderFoesPanel(); $('ovFoes').hidden = false; });
$('btnBal').addEventListener('click', () => { renderBalance(); $('ovBal').hidden = false; });
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => { $(b.dataset.close).hidden = true; }));
document.querySelectorAll('.ov').forEach(o => o.addEventListener('click', e => { if (e.target === o && o.id !== 'ovEnd') o.hidden = true; }));
$('foesList').addEventListener('click', e => {
  if (e.target.id === 'forget') { S.mem = {}; saveSettings(); if (G) G.adapt = null; renderFoesPanel(); render(); return; }
  const c = e.target.closest('.foe-card');
  if (c) newFight(c.dataset.e);
});
$('btnRematch').addEventListener('click', () => newFight(G.enemyId));
$('btnOther').addEventListener('click', () => { closeAll(); renderFoesPanel(); $('ovFoes').hidden = false; });
$('balBody').addEventListener('click', e => {
  const b = e.target.closest('.sb');
  if (!b) return;
  const d = RULE_DEFS.find(x => x.key === b.dataset.k);
  S.rules[d.key] = Math.max(d.min, Math.min(d.max, S.rules[d.key] + Number(b.dataset.d)));
  saveSettings(); renderBalance();
});
$('balBody').addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.v;
  if (!k) return;
  S.view[k] = e.target.checked;
  saveSettings(); render();
});
$('balApply').addEventListener('click', () => newFight(G ? G.enemyId : 'rock'));
$('balReset').addEventListener('click', () => { S.rules = {...RULES_V1}; S.view = {...VIEW_V1}; saveSettings(); renderBalance(); render(); });

function boot(data){
  if (data && data.G && data.G.phase !== 'reveal' && data.G.phase !== 'over') {
    G = data.G; U = freshU(); render();
  } else {
    newFight(S.last || 'rock');
  }
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({G: G ? clone(G) : null})); } catch(e) {}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
